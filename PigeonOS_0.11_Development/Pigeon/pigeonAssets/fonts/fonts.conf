<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Keep system fonts; FONTCONFIG_FILE replaces the whole config if used alone. -->
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <dir>~/.local/share/fonts/pigeon</dir>
  <!-- Illustrator / SVG exports use SharpSans-* family names without spaces. -->
  <alias binding="strong">
    <family>SharpSans-Extrabold</family>
    <prefer><family>Sharp Sans Extrabold</family></prefer>
  </alias>
  <alias binding="strong">
    <family>SharpSans-Semibold</family>
    <prefer><family>Sharp Sans Semibold</family></prefer>
  </alias>
  <alias binding="strong">
    <family>SharpSans-Medium</family>
    <prefer><family>Sharp Sans Medium</family></prefer>
  </alias>
  <alias binding="strong">
    <family>SharpSans-Bold</family>
    <prefer><family>Sharp Sans Bold</family></prefer>
  </alias>
</fontconfig>
